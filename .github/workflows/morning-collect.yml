name: Morning Collect

on:
  schedule:
    - cron: '30 0 * * 1-5' # UTC 00:30 = KST 09:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Collect calendar/news/inventory caches
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CALENDAR_PROXY_URL: ${{ secrets.CALENDAR_PROXY_URL }}
        run: |
          python -m collectors.calendar
          python -m collectors.news
          python -m collectors.inventory

      - name: Commit caches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache
          git diff --cached --quiet || git commit -m "chore: data $(date -u +%F)"
          git push
