name: Daily Report (manual test only)

# No schedule: the actual daily send runs locally via Windows Task
# Scheduler (scripts/run_daily.ps1, weekdays 15:50 KST) — SMTP_HOST only
# resolves from inside the company network, which no GitHub-hosted or
# self-hosted runner here is ever connected to (no runner was ever
# registered; this job used to target `[self-hosted, Windows]` and could
# never actually execute). Kept as workflow_dispatch for cheaply testing
# the collectors + AI layer from the cloud — the send step will still fail
# on SMTP unless run from the company network.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Build and send report
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          CALENDAR_PROXY_URL: ${{ secrets.CALENDAR_PROXY_URL }}
        run: python main.py --now

      - name: Commit report + history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: data $(date -u +%F)"
          git push
